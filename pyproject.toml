[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhm-assist"
version = "0.0.0"
description = "Notebook and helper workflows for NHM and NHF model support."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge", "nodefaults"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
branca = "*"
cdsapi = "*"
dask = "*"
dataretrieval = "*"
distributed = "*"
fiona = "*"
folium = "*"
geopandas = "*"
herbie-data = "*"
ipython = "*"
ipywidgets = "*"
jupyterlab = "*"
jupyter-black = "*"
jupyter_contrib_nbextensions = "*"
jupyter_server = "*"
jupytext = "*"
matplotlib = "*"
netcdf4 = "*"
networkx = "*"
numpy = "<=2.2.0"
pandas = ">=2.2,<3"
pip = "*"
plotly = ">=5,<6"
pyarrow = "*"
pydot = "*"
pyemu = "*"
pywatershed = ">=2.0.1"
pyyaml = "*"
requests = "*"
rich = "*"
"ruamel.yaml" = "*"
scipy = "*"
shapely = "*"
topojson = "*"
tqdm = "*"
xarray = "*"

[tool.pixi.pypi-dependencies]
nhm-assist = { path = ".", editable = true }
dotenv = "*"
hydroeval = "==0.1" # Unmaintained. Consider alternative.
pyprms = "*"

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
# unused in code but perhaps aspirational for future work?
gdptools = "*"
ipyleaflet = "*"
pint-xarray = "*"
tobler = "*"

[tool.pixi.tasks.setup]
cmd = "python -m assist.workspace.cli setup"
default-environment = "default"
description = "End-user entry point: interactive menu to pick a workspace, create projects, copy/import models, set the active model, generate notebooks, and launch JupyterLab."

[tool.pixi.tasks.dev]
cmd = "python -m workflow_templates.make_notebooks --workflow {{ workflow }} && jupyter lab --ServerApp.contents_manager_class=jupytext.TextFileContentsManager --ServerApp.root_dir=. --LabApp.default_url=/lab/tree/{{ notebook_dir }}"
args = [{ arg = "workflow", default = "nhm" }, { arg = "notebook_dir", default = "notebooks" }]
default-environment = "default"
description = "Contributor mode: regenerate notebooks from .py templates and launch JupyterLab against the repo (not a workspace). Edits sync back to src/workflow_templates/<workflow>/*.py via jupytext."

[tool.pixi.tasks.notebooks-create]
cmd = "python -m workflow_templates.make_notebooks --workflow {{ workflow }}"
args = [{ arg = "workflow", default = "all" }]
default-environment = "default"
description = "Generate notebooks from .py templates into the repo's notebook directories (does not launch Jupyter)."

[tool.pixi.tasks.notebooks-create-project]
cmd = "python -m workflow_templates.make_notebooks --workflow {{ workflow }} --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name", { arg = "workflow", default = "all" }]
default-environment = "default"
description = "Generate notebooks from .py templates into a project's notebook directory in the user workspace."

[tool.pixi.tasks.workspace-init]
cmd = "python -m assist.workspace.cli workspace-init --workspace-root {{ workspace_root }}"
args = ["workspace_root"]
default-environment = "default"
description = "Create an empty nhm-assist workspace at <workspace_root>; idempotent if the directory already exists."

[tool.pixi.tasks.project-create]
cmd = "python -m assist.workspace.cli project-create --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name"]
default-environment = "default"
description = "Create a new project under <workspace_root> with the standard project_config / models / notebooks layout."

[tool.pixi.tasks.project-list]
cmd = "python -m assist.workspace.cli project-list --workspace-root {{ workspace_root }}"
args = ["workspace_root"]
default-environment = "default"
description = "List every project in <workspace_root>."

[tool.pixi.tasks.project-set-active-model]
cmd = "python -m assist.workspace.cli project-set-active-model --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }}"
args = ["workspace_root", "project_name", "model_name"]
default-environment = "default"
description = "Designate which model the project's shared notebooks read by writing project_config/active_model.yaml."

[tool.pixi.tasks.model-create]
cmd = "python -m assist.workspace.cli model-create --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }}"
args = ["workspace_root", "project_name", "model_name"]
default-environment = "default"
description = "Create an empty model skeleton (config/, inputs/source_data/, outputs/runtime/) under a project."

[tool.pixi.tasks.model-list]
cmd = "python -m assist.workspace.cli model-list --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name"]
default-environment = "default"
description = "List every model defined under the given project."

[tool.pixi.tasks.model-copy-example]
cmd = "python -m assist.workspace.cli model-copy-example --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }} --example-name {{ example_name }}"
args = ["workspace_root", "project_name", "model_name", "example_name"]
default-environment = "default"
description = "Copy a bundled example subdomain (e.g. Walla_Walla) into a project under the given model name."

[tool.pixi.tasks.model-import]
cmd = "python -m assist.workspace.cli model-import --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }} --source-dir {{ source_dir }}"
args = ["workspace_root", "project_name", "model_name", "source_dir"]
default-environment = "default"
description = "Import an existing PRMS model folder from <source_dir> into a project under the given model name."

[tool.pixi.tasks.lint]
cmd = "ruff check . && ruff format --check ."
default-environment = "dev"
description = "Lint and check formatting with ruff."

[tool.pixi.tasks.test]
cmd = "pytest tests/"
default-environment = "dev"
description = "Run the test suite."
