# ==========================================================================
# BUILD SYSTEM
# ==========================================================================
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# ==========================================================================
# PACKAGE METADATA
#
# The published contract: what `pip install nhm-assist` resolves, and what
# a conda-forge recipe is generated from.
# ==========================================================================
[project]
name = "nhm-assist"
dynamic = ["version"]
description = "Python workflows for evaluating, running and interpreting National Hydrologic Model results using pywatershed."
authors = [
  { name = "U.S. Geological Survey" },
]
maintainers = [
  { name = "Adel Haj", email = "ahaj@usgs.gov" },
]
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

# The single authoritative runtime contract, in PyPI names. This is what
# `pip install nhm-assist` resolves and what a conda-forge recipe is generated
# from. It covers both `src/assist/` and the jupytext notebook templates under
# `src/workflow_templates/`, since generating and running those notebooks is a
# core feature of this package rather than an optional add-on.
#
# `[tool.pixi.dependencies]` below is NOT a mirror of this list: it names only
# the subset worth sourcing from conda-forge (compiled packages and ones that
# bind to system libraries). Everything else here is pure Python and installs
# from PyPI via the editable self-install, so there is one list to maintain.
dependencies = [
  "branca",
  "cdsapi",
  "dask",
  "dataretrieval",
  "distributed",
  "fiona",
  "folium",
  "geopandas",
  "herbie-data",
  "hydroeval==0.1",          # unmaintained; consider an alternative
  "ipython",
  "ipywidgets",
  "jupyter-black",
  "jupyter-server",
  "jupyterlab",
  "jupytext",
  "matplotlib",
  "netcdf4",
  "networkx",
  "numpy",
  "pandas>=2.2",
  "plotly>=5,<6",
  "pyarrow",
  "pydot",
  "pyemu",
  "pyogrio",
  "pyprms",
  "python-dotenv",
  "pywatershed>=2.0.1",
  "pyyaml",
  "rasterio",
  "rasterstats",
  "requests",
  "rioxarray",
  "rich",
  "ruamel.yaml",
  "scikit-image",
  "scipy",
  "shapely",
  "topojson",
  "tqdm",
  "xarray",
]

[project.urls]
Homepage = "https://code.usgs.gov/wma/hytest/nhm-assist"

[dependency-groups]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "pre-commit"]
dev-future = ["gdptools", "ipyleaflet", "pint-xarray", "tobler"]

# ==========================================================================
# BUILD BACKEND
#
# Version comes from git tags; these say what lands in the wheel.
# ==========================================================================
[tool.hatch.version]
source = "vcs"
fallback-version = "2.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/assist/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/assist", "src/workflow_templates"]

# ==========================================================================
# PIXI -- ENVIRONMENTS
#
# Which environments exist, which features each composes, and what gets set
# on activation. Start here to understand the rest of the pixi config.
# ==========================================================================
[tool.pixi.workspace]
channels = ["conda-forge", "nodefaults"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.environments]
# `default` is the only environment contributors and end users need. `ci` drops
# proj-data and the dev feature's lint tooling; see "Environment" in AGENTS.md.
# The dev *feature* is retained below -- dev-future still composes it.
default = { features = ["prod", "test", "dev"], solve-group = "default" }
ci = { features = ["prod", "test"], solve-group = "default" }
dev-future = { features = ["test", "dev", "dev-future"], solve-group = "future" }

# Stops user site-packages shadowing this environment; see "User site-packages"
# in AGENTS.md.
[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"

# ==========================================================================
# PIXI -- DEPENDENCIES
#
# Three layers: the conda-forge table, the PyPI table, then per-feature
# additions. Read alongside [tool.pixi.environments] above.
# ==========================================================================
# Only what is worth getting from conda-forge: compiled packages and ones that
# bind to system libraries. Pure-Python requirements come from
# [project.dependencies] via the editable self-install below.
[tool.pixi.dependencies]
cdsapi = "*"
dask = "*"
distributed = "*"
fiona = "*"
geopandas = "*"
herbie-data = "*"
matplotlib = "*"
netcdf4 = "*"
# pywatershed jit-compiles during import, and numba is ABI-coupled to numpy.
# Keep it on conda-forge; do not let it resolve from PyPI.
numba = "*"
numpy = "*"
pandas = ">=2.2"
pyarrow = "*"
rasterio = "*"
rasterstats = "*"
pydot = "*"
pyemu = "*"
pyogrio = "*"
pyyaml = "*"
scikit-image = "*"
scipy = "*"
shapely = "*"
xarray = "*"
openpyxl = ">=3.1.5,<4"
rioxarray = ">=0.19.0,<0.24"
gdptools = ">=0.4.0,<0.5"

[tool.pixi.pypi-dependencies]
# Editable self-install, pulling [project.dependencies]. On the default
# feature so every environment composes it.
nhm-assist = { path = ".", editable = true }
# Not on conda-forge.
hydroeval = "==0.1" # Unmaintained. Consider alternative.
pyprms = "*"

[tool.pixi.feature.prod.dependencies]
# Held at 3.11 deliberately, now that the PyPI pywatershed below no longer
# caps it. See "Why pywatershed comes from PyPI" in AGENTS.md.
python = ">=3.11.9,<3.12"
dataretrieval = "<1.2"
# Temporary holds; see "Temporary dependency pins" in AGENTS.md.
hdf5 = ">=1.14,<2"
pandas = ">=2.2,<3"

# PyPI, not conda-forge, and on `prod` rather than the default feature. Both
# are load-bearing; see "Why pywatershed comes from PyPI" in AGENTS.md.
[tool.pixi.feature.prod.pypi-dependencies]
pywatershed = ">=2.0.1,<3"

[tool.pixi.feature.dev.dependencies]
proj-data = "*"

# Scoped to dev on purpose: `ci` gets neither this nor proj-data. Work item
# #33, and "Environment" in AGENTS.md. Don't "fix" this.
[tool.pixi.feature.dev.activation.env]
PROJ_NETWORK = "OFF"

[tool.pixi.feature.dev-future.dependencies]
python = ">=3.12,<3.14"
pywatershed = ">=3,<4"
dataretrieval = ">=1.2"

# ==========================================================================
# PIXI -- TASKS
#
# Everything runnable as `pixi run <name>`. Each task's description is what
# `pixi task list` prints, so keep them accurate.
# ==========================================================================
# --- End-user entry point -----------------------------------------------
[tool.pixi.tasks.setup]
cmd = "python -m assist.workspace.cli setup"
default-environment = "default"
description = "End-user entry point: interactive menu to pick a workspace, create projects, copy/import models, set the active model, and generate notebooks. Prints how to open Jupyter; does not launch it."

# --- Notebook generation ------------------------------------------------
[tool.pixi.tasks.dev-mode]
cmd = "python -m workflow_templates.make_notebooks --workflow {{ workflow }} --workspace-root {{ workspace_root }} --project-name {{ project_name }} --pairing-mode dev"
args = ["workspace_root", "project_name", { arg = "workflow", default = "nhm" }]
default-environment = "default"
description = "Contributor mode: generate a project's notebooks paired back to src/workflow_templates/<workflow>/*.py, so editing them in Jupyter edits the templates. Does not launch Jupyter."

[tool.pixi.tasks.notebooks-create-project]
cmd = "python -m workflow_templates.make_notebooks --workflow {{ workflow }} --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name", { arg = "workflow", default = "all" }]
default-environment = "default"
description = "Generate notebooks from .py templates into a project's notebook directory in the user workspace."

# --- Workspace, project and model management ----------------------------
[tool.pixi.tasks.workspace-init]
cmd = "python -m assist.workspace.cli workspace-init --workspace-root {{ workspace_root }}"
args = ["workspace_root"]
default-environment = "default"
description = "Create an empty nhm-assist workspace at <workspace_root>; idempotent if the directory already exists."

[tool.pixi.tasks.project-create]
cmd = "python -m assist.workspace.cli project-create --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name"]
default-environment = "default"
description = "Create a new project under <workspace_root> with the standard project_config / models / notebooks layout."

[tool.pixi.tasks.project-list]
cmd = "python -m assist.workspace.cli project-list --workspace-root {{ workspace_root }}"
args = ["workspace_root"]
default-environment = "default"
description = "List every project in <workspace_root>."

[tool.pixi.tasks.project-set-active-model]
cmd = "python -m assist.workspace.cli project-set-active-model --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }}"
args = ["workspace_root", "project_name", "model_name"]
default-environment = "default"
description = "Designate which model the project's shared notebooks read by writing project_config/active_model.yaml."

[tool.pixi.tasks.model-create]
cmd = "python -m assist.workspace.cli model-create --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }}"
args = ["workspace_root", "project_name", "model_name"]
default-environment = "default"
description = "Create an empty model skeleton (config/, inputs/source_data/, outputs/runtime/) under a project."

[tool.pixi.tasks.model-list]
cmd = "python -m assist.workspace.cli model-list --workspace-root {{ workspace_root }} --project-name {{ project_name }}"
args = ["workspace_root", "project_name"]
default-environment = "default"
description = "List every model defined under the given project."

[tool.pixi.tasks.model-copy-example]
cmd = "python -m assist.workspace.cli model-copy-example --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }} --example-name {{ example_name }}"
args = ["workspace_root", "project_name", "model_name", "example_name"]
default-environment = "default"
description = "Copy a bundled example subdomain (e.g. Walla_Walla) into a project under the given model name."

[tool.pixi.tasks.model-import]
cmd = "python -m assist.workspace.cli model-import --workspace-root {{ workspace_root }} --project-name {{ project_name }} --model-name {{ model_name }} --source-dir {{ source_dir }}"
args = ["workspace_root", "project_name", "model_name", "source_dir"]
default-environment = "default"
description = "Import an existing PRMS model folder from <source_dir> into a project under the given model name."

# --- Developer checks ---------------------------------------------------
[tool.pixi.tasks.lint]
cmd = "ruff check . && ruff format --check ."
default-environment = "default"
description = "Lint and check formatting with ruff."

[tool.pixi.tasks.test]
# `python -m pytest` rather than bare `pytest`: the -m form puts the repo root
# on sys.path, which tests/unification/ needs. Bare `pytest` collects only 174
# of 446 tests and errors out on the other 18 modules.
cmd = "python -m pytest tests/"
default-environment = "default"
description = "Run the test suite."
