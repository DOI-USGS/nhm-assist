# Primary development, issues, and merge review for this repository now
# happen on GitLab (code.usgs.gov/wma/hytest/nhm-assist). GitLab does not
# read this file at all -- it only ever executes .gitlab-ci.yml -- so this
# workflow only fires on pushes to the read-only GitHub mirror
# (github.com/DOI-USGS/nhm-assist), not on GitLab merge requests.
#
# A GitLab CI migration is designed but not yet implemented; see
# docs/superpowers/specs/2026-08-25-gitlab-ci-migration-design.md for the
# design and its open questions. Until that lands, this workflow is kept
# as the real, working CI (pixi + pytest) rather than deleted, so its
# schedule/matrix/logic aren't lost as reference.
name: NHM-Assist continuous integration
on:
  # run at 6 AM UTC every day
  # this time is checked below for certain actions: change everywhere if you change
  schedule:
    - cron: "0 6 * * *"
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       shell: bash
  #   steps:
  #     - name: Checkout repo
  #       uses: actions/checkout@v4

  #     - name: Setup python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.10'

  #     - name: Install ruff
  #       run: pip install ruff

  #     - name: Lint
  #       run: ruff check .

  #     - name: Check format
  #       run: ruff format . --check

  test:
    name: test notebooks
    # needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest", "ubuntu-latest"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environment: dev
          cache: true

      # Osx and Linux start with nearly the same speed, Windows is slower.
      - name: Scheduled - delay Linux to not hit ORDWR servers simultaneously
        if: ${{ (github.event.schedule == '0 6 * * *') && (runner.os == 'Linux') }}
        run: |
          python -c "import time; time.sleep(210)"

      - name: Run tests
        run: pixi run test